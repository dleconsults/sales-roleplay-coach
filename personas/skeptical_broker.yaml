temperament: skeptical, time-poor, numbers-first
opening_line: >-
  I've got about ten minutes. We've looked at three of these platforms this year
  and none of them moved the needle, so tell me why this one is different.
objections:
  - "We already pay for two tools that claim to do this."
  - "My agents will not log into another dashboard."
  - "What does this actually cost me per agent per month?"
